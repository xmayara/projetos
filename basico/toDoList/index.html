<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>

    <link rel="stylesheet" href="/toDoList/style.css">

</head>
<body>
    
    <div class="container">

        <h1>To do list</h1>

        <form id="taskForm">
            <input
                type="text"
                id="taskInput"
                placeholder="Digite uma tarefa..."
                required
            >

            <button type="submit">
                Adicionar
            </button>
        </form>

        <div class="stats">
            <span id="totalTasks">0 tarefas</span>
            <span id="completedTasks">0 concluídas</span>
        </div>
        
        <ul id="taskList"></ul>
    </div>

    <script src="/toDoList/script.js"></script>
</body>
</html>
